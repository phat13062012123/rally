<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Rally</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .user-menu { display: flex; align-items: center; gap: 10px; position: relative; }
  .user-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    cursor: pointer; transition: transform .15s;
  }
  .user-avatar:hover { transform: scale(1.08); }
  .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  .welcome-band { padding: 44px 0 8px; }
  .welcome-band .eyebrow { font-family: var(--font-mono); font-size: 12.5px; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .welcome-band h1 { font-family: var(--font-display); font-size: 30px; }
  .welcome-band p { color: var(--text-secondary); margin-top: 6px; font-size: 15px; }

  /* Profile Modal */
  .profile-modal {
    display: none; position: absolute; top: 64px; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 380px; box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    z-index: 100;
  }
  .profile-modal.show { display: block; }
  .profile-modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .profile-modal-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 17px; flex-shrink: 0;
    overflow: hidden;
  }
  .profile-modal-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-modal-info h3 { font-size: 16px; margin-bottom: 2px; }
  .profile-modal-info .meta { font-size: 12px; color: var(--text-secondary); }

  .profile-modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .profile-modal-stat { text-align: center; }
  .profile-modal-stat .num { font-family: var(--font-mono); font-weight: 600; font-size: 18px; }
  .profile-modal-stat .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .profile-modal-actions { display: flex; flex-direction: column; gap: 8px; }
  .profile-modal-actions a, .profile-modal-actions button {
    padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 13.5px; font-weight: 600; text-align: center;
    transition: all .15s; color: var(--ink); text-decoration: none; display: block;
  }
  .profile-modal-actions a:hover, .profile-modal-actions button:hover { background: var(--bg); }
  .profile-modal-actions .logout { border-color: var(--danger); color: var(--danger); }
  .profile-modal-actions .logout:hover { background: rgba(239, 68, 68, 0.1); }

  @media (max-width: 600px) {
    .profile-modal { width: calc(100vw - 32px); right: 50%; transform: translateX(50%); }
  }

  /* Matches Section */
  .matches-section { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--border); }
  .matches-section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  .matches-section-head h2 { font-size: 18px; font-weight: 600; }
  .matches-section-head a { font-size: 13px; color: var(--primary); text-decoration: none; }
  .matches-section-head a:hover { text-decoration: underline; }

  .match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .match-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s, transform .15s;
  }
  .match-card:hover { border-color: var(--primary); transform: translateY(-2px); }

  .match-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .match-card h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
  .badge-skill {
    flex-shrink: 0; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    padding: 3px 9px; border-radius: 100px; background: var(--primary-light); color: var(--primary);
    white-space: nowrap;
  }

  .match-card .meta-line { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .slot-bar { display: flex; gap: 3px; margin-top: 4px; }
  .slot { flex: 1; height: 7px; border-radius: 4px; background: var(--primary-light); }
  .slot.filled { background: var(--primary); }
  .slot-label { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; margin-top: 6px; }
  .slot-label b { color: var(--ink); font-weight: 600; }
  .match-card .price { font-size: 13px; color: var(--text-secondary); }
  .match-card .full-tag { font-size: 12px; font-weight: 600; color: #c43d3d; }
  .match-card .btn { margin-top: 4px; }

  .state-box { text-align: center; padding: 70px 20px; color: var(--text-secondary); }
  .state-box .ic { font-size: 32px; margin-bottom: 10px; }
  .state-box p { font-size: 14px; }

  @media (max-width: 980px) { .match-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .match-grid { grid-template-columns: 1fr; } }

</style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="spinner spinner-dark" style="width:28px;height:28px;"></div>
</div>

<div id="appContent" style="display:none;">

  <nav class="navbar">
    <div class="wrap">
      <div class="logo"><a href="dashboard.html">Rally</a></div>
      <div class="nav-links">
        <a href="findmatch.html">🔎 Tìm trận</a>
        <a href="findcourt.html">📍 Tìm sân</a>
        <a href="creatematch.html">➕ Tạo trận</a>
        <a href="#">� Trò chuyện</a>
        <a href="#">🔔 Thông báo</a>
      </div>
      <div class="user-menu">
        <div class="user-avatar" id="userAvatar" title="Hồ sơ cá nhân" onclick="toggleProfileModal(event)">?</div>
        <div class="profile-modal" id="profileModal">
          <div class="profile-modal-header">
            <div class="profile-modal-avatar" id="modalAvatar">?</div>
            <div class="profile-modal-info">
              <h3 id="modalName">—</h3>
              <div class="meta" id="modalMeta">—</div>
            </div>
          </div>
          <div class="profile-modal-stats">
            <div class="profile-modal-stat">
              <div class="num" id="modalMatches">0</div>
              <div class="label">Trận</div>
            </div>
            <div class="profile-modal-stat">
              <div class="num" id="modalPlayers">0</div>
              <div class="label">Đã gặp</div>
            </div>
            <div class="profile-modal-stat">
              <div class="num" id="modalRating">0</div>
              <div class="label">Đánh giá</div>
            </div>
          </div>
          <div class="profile-modal-actions">
            <button class="logout" onclick="handleLogout()">Đăng xuất</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <div class="welcome-band">
      <div class="eyebrow">Dashboard</div>
      <h1 id="welcomeText">Chào mừng trở lại 👋</h1>
      <p>Đây là nơi bắt đầu — tìm trận, tạo trận, hoặc xem lại hồ sơ của bạn.</p>
    </div>

    <div class="matches-section">
      <div class="matches-section-head">
        <h2>Trận đang tuyển người</h2>
        <a href="findmatch.html">Xem tất cả</a>
      </div>
      <div id="matchListArea">
        <div class="state-box">
          <div class="ic">⏳</div>
          <p>Đang tải danh sách trận...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { auth, onAuthStateChanged, signOut } from "../js/firebase-config.js";
import { getPlayerProfile } from "../js/profile-service.js";
import { listenToMatches, formatMatchDate } from "./match-service.js";

function initials(name) {
  return (name || "?").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

function toggleProfileModal(event) {
  event.stopPropagation();
  const modal = document.getElementById("profileModal");
  modal.classList.toggle("show");
}

// Close modal when clicking outside
document.addEventListener("click", (e) => {
  const modal = document.getElementById("profileModal");
  const userMenu = document.querySelector(".user-menu");
  if (modal && !userMenu.contains(e.target)) {
    modal.classList.remove("show");
  }
});

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderMatchCard(m) {
  const isFull = (m.currentPlayers ?? 0) >= (m.maxPlayers ?? 0);
  const total = m.maxPlayers ?? 0;
  const filled = Math.min(m.currentPlayers ?? 0, total);
  const slots = Array.from({ length: total }, (_, i) =>
    `<div class="slot ${i < filled ? "filled" : ""}"></div>`
  ).join("");
  const priceLabel = m.pricePerPerson
    ? `${Number(m.pricePerPerson).toLocaleString("vi-VN")}đ / người`
    : "Miễn phí / tự thoả thuận";

  return `
    <div class="match-card">
      <div class="top-row">
        <h3>${escapeHtml(m.title || "Trận chưa đặt tên")}</h3>
        <span class="badge-skill">${escapeHtml(m.skillLevel || "All")}</span>
      </div>
      <div class="meta-line">📍 ${escapeHtml(m.courtName || "")}${m.area ? " · " + escapeHtml(m.area) : ""}</div>
      <div class="meta-line">🗓️ ${formatMatchDate(m.date)} · ${escapeHtml(m.startTime || "")}–${escapeHtml(m.endTime || "")}</div>
      <div class="slot-bar">${slots}</div>
      <div class="slot-label"><span><b>${filled}/${total}</b> người chơi</span>${isFull ? '<span class="full-tag">Đã đủ người</span>' : ""}</div>
      <div class="price">${priceLabel}</div>
      <button type="button" class="btn ${isFull ? "btn-outline" : "btn-primary"} btn-block" ${isFull ? "disabled" : ""}>
        ${isFull ? "Đã đủ người" : "Tham gia trận"}
      </button>
    </div>
  `;
}

function renderMatches(matches) {
  const listArea = document.getElementById("matchListArea");
  
  if (!matches || matches.length === 0) {
    listArea.innerHTML = `
      <div class="state-box">
        <div class="ic">🏸</div>
        <p>Không có trận nào đang tuyển người.<br>Quay lại sau hoặc tạo một trận mới!</p>
      </div>`;
    return;
  }

  listArea.innerHTML = `<div class="match-grid">${matches.slice(0, 6).map(renderMatchCard).join("")}</div>`;
}

function showDashboard(profile) {
  const name = profile.displayName || "bạn";
  const firstName = name.split(" ")[0];
  const styles = Array.isArray(profile.playingStyle) ? profile.playingStyle.join(" · ") : "";
  const metaParts = [profile.skillLevel, styles, profile.favoriteCourt].filter(Boolean);
  const metaText = metaParts.join(" · ") || "Hoàn tất hồ sơ để hiện trình độ và sân yêu thích";

  // Welcome text
  document.getElementById("welcomeText").textContent = `Chào mừng trở lại, ${firstName} 👋`;

  // Populate modal
  document.getElementById("modalName").textContent = name;
  document.getElementById("modalMeta").textContent = metaText;
  document.getElementById("modalMatches").textContent = profile.matchesPlayed ?? 0;
  document.getElementById("modalPlayers").textContent = profile.playersMet ?? 0;
  document.getElementById("modalRating").textContent = profile.rating ?? 0;

  // Update avatars
  const avatarInitials = initials(name);
  const avatarEls = [document.getElementById("userAvatar"), document.getElementById("modalAvatar")];
  avatarEls.forEach((el) => {
    if (profile.photoURL) {
      el.innerHTML = `<img src="${profile.photoURL}" alt="${name}">`;
    } else {
      el.textContent = avatarInitials;
    }
  });

  // Load matches
  const unsubscribe = listenToMatches((matches) => {
    renderMatches(matches);
  });

  document.getElementById("pageLoader").style.display = "none";
  document.getElementById("appContent").style.display = "block";
}

function readProfileWithTimeout(uid, timeoutMs = 5000) {
  return Promise.race([
    getPlayerProfile(uid),
    new Promise((_, reject) => {
      setTimeout(() => reject(new Error("PROFILE_READ_TIMEOUT")), timeoutMs);
    }),
  ]);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("auth.html");
    return;
  }

  try {
    const profile = await readProfileWithTimeout(user.uid);
    if (!profile) {
      window.location.replace("onboarding.html");
      return;
    }
    showDashboard(profile);
  } catch (err) {
    console.error("Không đọc được hồ sơ Firestore:", err);
    showDashboard({
      displayName: user.displayName || user.email,
      photoURL: user.photoURL,
      skillLevel: null,
      playingStyle: [],
      favoriteCourt: "Chưa tải được hồ sơ Firestore",
      matchesPlayed: 0,
      playersMet: 0,
      rating: 0,
    });
  }
});

window.toggleProfileModal = toggleProfileModal;
window.handleLogout = async () => {
  if (confirm("Đăng xuất khỏi Rally?")) {
    await signOut(auth);
    window.location.href = "auth.html";
  }
};
</script>
</body>
</html>
