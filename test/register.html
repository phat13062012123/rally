<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reclub · Đăng nhập / Đăng ký</title>
  <!-- Tailwind + custom palette -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#4338ca',    // indigo-700
              primaryLight: '#818cf8',
              secondary: '#f97316',  // orange-500
              accent: '#2dd4bf',     // teal-400
              dark: '#1e1b4b',       // indigo-950
              muted: '#e0e7ff',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Anybody', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: white;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(67, 56, 202, 0.15);
      transition: all 0.3s ease;
    }
    .toggle-btn {
      transition: all 0.2s ease;
      font-weight: 600;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      background: transparent;
      color: #64748b;
      border: 1px solid transparent;
    }
    .toggle-btn.active {
      background: #4338ca;
      color: white;
      box-shadow: 0 4px 12px rgba(67, 56, 202, 0.25);
    }
    .toggle-btn:not(.active):hover {
      background: #f1f5f9;
      color: #1e293b;
    }
    .input-field {
      transition: all 0.2s ease;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 1rem;
      padding: 0.75rem 1.25rem;
      width: 100%;
      font-size: 0.95rem;
    }
    .input-field:focus {
      outline: none;
      border-color: #4338ca;
      box-shadow: 0 0 0 4px rgba(67, 56, 202, 0.08);
      background: white;
    }
    .input-field::placeholder {
      color: #94a3b8;
    }
    .submit-btn {
      background: #4338ca;
      color: white;
      font-weight: 700;
      padding: 0.9rem;
      border-radius: 9999px;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(67, 56, 202, 0.25);
    }
    .submit-btn:hover {
      background: #3730a3;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(67, 56, 202, 0.3);
    }
    .brand-icon {
      color: #4338ca;
    }
    .form-panel {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }
    .form-panel.active {
      display: block;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .toggle-wrapper {
      background: #f1f5f9;
      border-radius: 9999px;
      padding: 0.25rem;
      display: inline-flex;
      border: 1px solid #e2e8f0;
    }
    .or-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .social-icon {
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 9999px;
      border: 1.5px solid #e2e8f0;
      color: #475569;
    }
    .social-icon:hover {
      border-color: #4338ca;
      color: #4338ca;
      background: #f8fafc;
    }
  </style>
</head>

<!-- toggle script -->
<script>
  (function() {
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');
    const switchToRegister = document.getElementById('switchToRegister');
    const switchToLogin = document.getElementById('switchToLogin');

    function activateLogin() {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginPanel.classList.add('active');
      registerPanel.classList.remove('active');
    }

    function activateRegister() {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerPanel.classList.add('active');
      loginPanel.classList.remove('active');
    }

    loginTab.addEventListener('click', activateLogin);
    registerTab.addEventListener('click', activateRegister);
    switchToRegister.addEventListener('click', activateRegister);
    switchToLogin.addEventListener('click', activateLogin);
  })();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile,
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyBpD0iha2sLAk3fMMxELGSLzuJdyCkAmL4",
    authDomain: "reclub-8206e.firebaseapp.com",
    projectId: "reclub-8206e",
    storageBucket: "reclub-8206e.firebasestorage.app",
    messagingSenderId: "410587996077",
    appId: "1:410587996077:web:f4c8a066d071008e2b0b24",
    measurementId: "G-4ZKT1MB4RC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const appUrl = "../files/rally-app-phase1/rally-app/";

  document.getElementById("testLoginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const fields = event.currentTarget.querySelectorAll("input");
    const button = event.currentTarget.querySelector("button[type=submit]");
    button.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, fields[0].value.trim(), fields[1].value);
      window.location.href = `${appUrl}dashboard.html`;
    } catch (error) {
      alert("Đăng nhập không thành công: " + (error.code || "lỗi không xác định"));
      button.disabled = false;
    }
  });

  document.getElementById("testRegisterForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const fields = event.currentTarget.querySelectorAll("input");
    const button = event.currentTarget.querySelector("button[type=submit]");
    if (fields[2].value !== fields[3].value) {
      alert("Mật khẩu xác nhận không khớp.");
      return;
    }
    button.disabled = true;
    try {
      const credential = await createUserWithEmailAndPassword(auth, fields[1].value.trim(), fields[2].value);
      await updateProfile(credential.user, { displayName: fields[0].value.trim() });
      window.location.href = `${appUrl}onboarding.html`;
    } catch (error) {
      alert("Đăng ký không thành công: " + (error.code || "lỗi không xác định"));
      button.disabled = false;
    }
  });
</script>
</body>
